# Local Stockline stack, fully offline (Phase 2 task 0): Postgres (indexer + API), Redis (rate limits, WS fan-out) and
# anvil loaded with the DeployLocal state (packages/devnet/fixtures/anvil-state.hex = addresses.json["31337"]).
#
#   docker compose up -d                  # infra only
#   scripts/dev.sh                        # infra + anvil + deploy + services (see the script)
#
# Local development only: no secrets here. Postgres trusts connections on the published port; never expose it.
name: stockline

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stockline
      POSTGRES_DB: stockline
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${STOCKLINE_PG_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockline"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${STOCKLINE_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: the fixture is anvil_dumpState output (hex of gzipped JSON); anvil --load-state wants the JSON.
  anvil-state:
    image: node:22-alpine
    volumes:
      - ./packages/devnet/fixtures:/fixtures:ro
      - anvilstate:/state
    command:
      - node
      - -e
      - >-
        const fs=require('fs'),z=require('zlib');
        const h=fs.readFileSync('/fixtures/anvil-state.hex','utf8').trim().replace(/^0x/,'');
        fs.writeFileSync('/state/state.json', z.gunzipSync(Buffer.from(h,'hex')));
        console.log('anvil state ready');

  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--chain-id", "31337", "--load-state", "/state/state.json"]
    ports:
      - "127.0.0.1:${STOCKLINE_ANVIL_PORT:-8545}:8545"
    volumes:
      - anvilstate:/state:ro
    depends_on:
      anvil-state:
        condition: service_completed_successfully

volumes:
  pgdata:
  anvilstate:
