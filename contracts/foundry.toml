[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
evm_version = "cancun"             # [VERIFY] Robinhood Chain EVM version, see docs/prd/12-open-questions.md
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "morpho-blue/=lib/morpho-blue/",
    "metamorpho/=lib/metamorpho-v1.1/",
    "lib/metamorpho-v1.1/lib/morpho-blue/=lib/morpho-blue/",
]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 256
depth = 100
fail_on_revert = true

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 512
depth = 200

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
wrap_comments = true
ignore = ["lib/**"]
