[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
evm_version = "cancun"             # Robinhood Chain runs cancun opcodes (A4, verified Phase 0; docs/phase0/01-chain-facts.md)
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [
    {access = "read", path = "./out"},
    {access = "read", path = "./test/vectors"},
    {access = "read", path = "../packages/sdk/data"},
    {access = "read", path = "../packages/sdk/external-addresses.json"},
    {access = "read-write", path = "../packages/sdk/addresses.json"},
]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "morpho-blue/=lib/morpho-blue/",
    "metamorpho/=lib/metamorpho-v1.1/",
    "lib/metamorpho-v1.1/lib/morpho-blue/=lib/morpho-blue/",
]

# Morpho Vault V2 (lib/vault-v2 @ 2025-12-04, 425f6b1) is compiled exactly as Morpho deployed it on chain 4663
# (Sourcify: solc 0.8.28, via-IR, 100 000 runs, cancun, bytecode_hash none), so a vault built from this source has
# the live runtime code (LM-R20; test/fork/phase1/VaultV2CodeHash.fork.t.sol). Never modified.
[[profile.default.compilation_restrictions]]
paths = "lib/vault-v2/src/**"
via_ir = true
optimizer_runs = 100000

[[profile.default.compilation_restrictions]]
paths = "test/utils/vaultv2/**"
via_ir = true
optimizer_runs = 100000

# MetaMorpho v1.1 (superseded by Vault V2, D6; kept for the scaffold smoke test and the Phase 0 fork record) is
# compiled with its own settings (via-IR, 200 runs); without via-IR its factory exceeds EIP-170.
[[profile.default.compilation_restrictions]]
paths = "lib/metamorpho-v1.1/src/**"
via_ir = true
optimizer_runs = 200

[[profile.default.additional_compiler_profiles]]
name = "metamorpho"
via_ir = true
optimizer_runs = 200

[[profile.default.additional_compiler_profiles]]
name = "vaultv2"
via_ir = true
optimizer_runs = 100000

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 256
depth = 100
fail_on_revert = true

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 512
depth = 200

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
wrap_comments = true
ignore = ["lib/**"]
