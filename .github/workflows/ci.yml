name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      # Only the submodules the build needs. solc compiles MetaMorpho against our top-level morpho-blue via a
      # remapping (see foundry.toml); the nested copy is checked out only so forge's linter can resolve paths.
      - name: Checkout submodules
        working-directory: .
        run: |
          git submodule update --init --depth 1 contracts/lib/forge-std contracts/lib/openzeppelin-contracts \
            contracts/lib/morpho-blue contracts/lib/metamorpho-v1.1 contracts/lib/vault-v2
          git -C contracts/lib/metamorpho-v1.1 submodule update --init --depth 1 lib/openzeppelin-contracts lib/morpho-blue
          git -C contracts/lib/vault-v2 submodule update --init --depth 1 lib/morpho-blue lib/morpho-blue-irm
          git -C contracts/lib/vault-v2/lib/morpho-blue-irm submodule update --init --depth 1 lib/morpho-blue
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: forge fmt --check
        run: forge fmt --check
      - name: forge build
        run: forge build --sizes
      - name: forge test
        run: forge test -vvv

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout submodules
        run: |
          git submodule update --init --depth 1 contracts/lib/forge-std contracts/lib/openzeppelin-contracts \
            contracts/lib/morpho-blue contracts/lib/metamorpho-v1.1 contracts/lib/vault-v2
          git -C contracts/lib/metamorpho-v1.1 submodule update --init --depth 1 lib/openzeppelin-contracts lib/morpho-blue
          git -C contracts/lib/vault-v2 submodule update --init --depth 1 lib/morpho-blue lib/morpho-blue-irm
          git -C contracts/lib/vault-v2/lib/morpho-blue-irm submodule update --init --depth 1 lib/morpho-blue
      - uses: crytic/slither-action@v0.4.1
        with:
          target: contracts
          slither-config: contracts/slither.config.json
          fail-on: medium

  typescript:
    # SDK, devnet (chain driver), keepers and every Phase 2 service. Tests start anvil with the DeployLocal fixture
    # and use these Postgres/Redis services through DATABASE_URL / REDIS_URL (packages/devnet/src/infra.ts).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockline
          POSTGRES_DB: stockline
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stockline" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://stockline@127.0.0.1:5432/stockline
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1 # tests run anvil with the DeployLocal fixture
        with:
          version: stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - name: OpenAPI and the SDK's generated client are up to date
        run: pnpm --filter @stockline/sdk build && pnpm --filter @stockline/api openapi && git diff --exit-code api/openapi.json packages/sdk/src/api/schema.ts
      - run: pnpm -r test

  web-e2e:
    # 06 acceptance on anvil: Playwright drives every router flow through the production build; Lighthouse ≥ 85.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockline
          POSTGRES_DB: stockline
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stockline" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://stockline@127.0.0.1:5432/stockline
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @stockline/sdk build
      - run: pnpm --filter @stockline/web exec playwright install --with-deps chromium
      - run: pnpm --filter @stockline/web e2e
      - run: pnpm --filter @stockline/web lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-e2e
          path: |
            web/e2e/.report
            web/lighthouse
